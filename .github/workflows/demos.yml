# Builds every demo image with jib and deploys the public ones to Cloud Run.
name: Demos

on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  workflow_dispatch:

# One deploy at a time per branch; a superseded build is not worth finishing.
concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B --no-transfer-progress -Dmaven.artifact.threads=16
  MAVEN_OPTS: -Xmx3g
  REGISTRY: registry.hub.docker.com/springdocdemos
  REGION: europe-west1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # jib picks the credentials up from the docker config this action writes.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The extra sha tag is what the deploy job pulls, so a redeploy is immutable.
      - name: Build and push the images
        run: mvn $MAVEN_ARGS -Pjib package jib:build -T1C -Djib.to.tags=${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - demo-spring-boot-webmvc
          - demo-spring-boot-webflux
          - demo-spring-boot-webmvc-scalar
          - demo-spring-boot-webflux-scalar
          - demo-spring-boot-webflux-functional
          - spring-cloud-function-webmvc
          - spring-cloud-function-webflux
          - demo-spring-boot-mcp
          - demo-spring-boot-mcp-authorization-server
    steps:
      # Keyless auth through workload identity federation; no service account key.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # SERVER_PORT overrides the port each demo hardcodes in application.yml.
      # no-allow-unauthenticated keeps the run.app URL closed: only the Cloudflare
      # worker holds a service account with run.invoker, so there is no way around it.
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ matrix.service }}
          image: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          region: ${{ env.REGION }}
          env_vars: SERVER_PORT=8080
          flags: >-
            --no-allow-unauthenticated --port=8080 --cpu=1 --memory=512Mi
            --min-instances=0 --max-instances=2 --concurrency=80 --timeout=30s
            --service-account=cloudrun-runtime@springdoc.iam.gserviceaccount.com
