server:
  port: 8090
  request:
    header:
      forwarded:
        strategy: framework
        use-prefix: true
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka}
  instance:
    preferIpAddress: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} ${LOG_LEVEL_PATTERN:-%5p} %m%n"

springdoc:
  cache:
    disabled: true
  version: '@springdoc.version@'