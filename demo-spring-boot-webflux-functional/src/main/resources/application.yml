server:
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  http2:
    enabled: true
  port: 8084
  request:
    header:
      forwarded:
        strategy: framework
        naming: rfc-7239
springdoc:
  version: '@springdoc.version@'
  swagger-ui:
    use-root-path: true